<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Objeto fabricado</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Grenze:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
html,body{overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;filter:brightness(.35) blur(1px)}
.veil{position:fixed;inset:0;display:grid;place-items:center;padding:12px}
.modal{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--s9);border:1px solid var(--c-rare);box-shadow:0 0 0 1px #000,0 0 40px rgba(74,143,224,.25);padding:16px;display:flex;flex-direction:column;gap:10px}
.modal .kick{font:600 14px Cinzel,serif;color:var(--s3);letter-spacing:.06em;text-align:center}
.it{display:flex;gap:12px;align-items:center}
.it .ic{width:72px;height:72px;font-size:40px;border:2px solid var(--c-rare);background:#101a2a}
.it h3{font:700 21px Cinzel,serif;color:var(--parch)}
.fine{display:inline-block;margin-top:3px;font-size:13px;border:1px solid var(--gold);color:var(--gold);padding:1px 6px}
.stats{display:grid;grid-template-columns:auto auto;gap:3px 18px;font-size:16px;width:max-content}
.stats .up{color:var(--ok);font-size:13px}
.desc{font-size:14px;color:var(--s3);border-top:1px solid var(--s7);padding-top:6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .btn{min-height:52px;font-size:17px}
.acts .btn small{display:block;font-size:12px;color:var(--s3);font-weight:400}
.acts .btn.main small{color:var(--bone)}
.foot{font-size:12px;color:var(--s3);text-align:center}
@media (max-height:560px){
  .modal{padding:8px 12px;gap:5px;width:min(620px,100%)}
  .it .ic{width:48px;height:48px;font-size:26px}
  .it h3{font-size:17px}
  .body{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
  .stats{font-size:14px}
  .desc{font-size:12px;border:0;padding:0}
  .acts .btn{min-height:44px;font-size:15px}
  .acts .btn small{display:inline;margin-left:4px}
  .foot{display:none}
}
</style></head><body>
<iframe src="crafteo.html" aria-hidden="true" tabindex="-1"></iframe>
<div class="veil"><div class="modal" role="dialog" aria-label="Objeto fabricado">
  <div class="kick">⚒ HAS FABRICADO</div>
  <div class="it"><span class="ic">🪓</span><div><h3>Hacha de batalla</h3><div class="r-rare" style="font-size:14px">Raro · Guerrero · nivel 7 · ×1</div><span class="fine">✦ Acabado fino: salió una rareza mejor</span></div></div>
  <div class="body">
    <div class="stats"><span>Ataque</span><b>11 <span class="up">(+2)</span></b><span>Velocidad</span><b class="bad">−1</b><span>Crítico</span><b>+2 % <span class="up">(atributo)</span></b><span>Golpe</span><b>Tajo (cortante)</b><span>Durabilidad</span><b>100 / 100</b></div>
    <div class="desc">Enseña: Golpe brutal, Partecráneos. «Pesada pero fiable.»</div>
  </div>
  <div class="acts"><button class="btn">🎒 A la mochila <small>(cabe)</small></button><button class="btn main">📦 Al almacén <small>(recomendado)</small></button></div>
  <div class="foot">Si cierras sin elegir, va al almacén.</div>
</div></div>
</body></html>
