<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Alijo móvil</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Alegreya+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{background:#07060a;color:#e9e1cc;font:13px 'Alegreya Sans',sans-serif;width:844px;height:390px;overflow:hidden}
.top{height:52px;display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid #2a2830}
.tab{width:46px;height:44px;border:1px solid #3a3741;background:#141318;display:grid;place-items:center;font-size:18px;color:#a8a29e}.tab.on{background:#e9e1cc;color:#111;width:90px;font-family:Cinzel;font-size:13px}
.gold{margin-left:auto;color:#e8b33a;font-weight:700}
.main{display:flex;gap:6px;padding:6px 8px;height:338px}
.side{display:flex;flex-direction:column;gap:6px}.side div{width:50px;height:50px;border:1px solid #3a3741;display:grid;place-items:center;font-size:20px;background:#141318}.side .on{background:#e8b33a;color:#111}
.panel{border:1px solid #3a3741;background:#0f0e13;padding:8px;display:flex;flex-direction:column}
.cap{font-family:Cinzel;color:#e8b33a;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.s{width:44px;height:44px;border:1px solid #2a2830;background:#141318;display:grid;place-items:center;font-size:20px}
.s.f{border-color:#57534e;background:#1b1a21}.s.big{height:92px}.s.em{opacity:.35}
.doll{display:grid;grid-template-columns:44px 44px 44px;grid-template-areas:'a c b' 'a m b' 'g t r' 'o p k';gap:4px 22px;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(6,44px);gap:4px}
.btn{border:1px solid #57534e;background:#1b1a21;color:#e9e1cc;font:700 12px 'Alegreya Sans';min-height:44px;padding:0 12px;display:grid;place-items:center}
.bar{height:6px;background:#2a2830;margin:3px 0}.bar i{display:block;height:100%;width:40%;background:#7fb069}
.row{display:flex;justify-content:space-between;align-items:center}
.note{position:absolute;background:#e8b33a;color:#111;font:700 11px 'Alegreya Sans';padding:2px 6px;border-radius:9px}
</style></head><body>
<div class="top"><div class="tab">⌂</div><div class="tab">◈</div><div class="tab on">ALIJO</div><div class="tab">✚</div><div class="tab">♜</div><div class="tab">☰</div><div class="tab">☠</div><div class="tab">♟</div><span class="gold">● 6</span><div class="tab">⛶</div><div class="tab">⚙</div></div>
<div class="main">
 <div class="side"><div class="on">⚔</div><div>▣</div></div>
 <div class="panel" style="width:236px">
  <div class="row" style="margin-bottom:6px"><span class="cap">Equipo</span><span style="color:#a8a29e;font-size:12px">Guerrero · Nv 1</span></div>
  <div class="doll">
   <div class="s f big" style="grid-area:a">🗡</div><div class="s em" style="grid-area:c">⛑</div><div class="s f big" style="grid-area:b">🛡</div>
   <div class="s em" style="grid-area:m">✧</div><div class="s em" style="grid-area:g">✋</div><div class="s f" style="grid-area:t">👕</div><div class="s em" style="grid-area:r">○</div>
   <div class="s" style="grid-area:o;border-color:#8b5cf6">◐</div><div class="s em" style="grid-area:p">👢</div><div class="s f" style="grid-area:k">🎒</div>
  </div>
  <div style="margin-top:auto"><div class="row" style="font-size:12px"><span>Carga <b style="color:#7fb069">16,2</b> / 40</span><span style="color:#a8a29e">En riesgo <b style="color:#e07a3a">12</b></span></div><div class="bar"><i></i></div></div>
 </div>
 <div class="panel" style="width:308px">
  <div class="row" style="margin-bottom:6px"><span class="cap">Mochila · 4/24</span><span style="display:flex;gap:4px"><span class="btn">Vaciar</span><span class="btn">Ordenar</span></span></div>
  <div class="grid">
   <div class="s f">🧪</div><div class="s f">🧴</div><div class="s f">🍞</div><div class="s f">🪨</div>
   <div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div>
  </div>
  <div class="row" style="margin-top:8px;border:1px solid #3a3741;padding:4px 6px;">
   <span><span class="cap" style="color:#a8a29e">Bolsillo seguro</span><br><span style="color:#5fd19a;font-size:12px">no se pierde al morir</span></span>
   <span style="display:flex;gap:4px"><div class="s"></div><div class="s"></div><div class="s"></div></span>
  </div>
 </div>
 <div class="panel" style="flex:1;align-items:center;justify-content:center;text-align:center;gap:6px">
  <span class="cap" style="color:#a8a29e">Ficha</span><div class="s" style="width:56px;height:56px;opacity:.5">?</div><span style="color:#a8a29e;font-size:12px">Toca un objeto</span>
 </div>
</div>
</body></html>
