<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Venta: rediseño</title><style>body{margin:0;background:#0a090c;color:#e6e0d2;font:16px/1.5 Georgia,serif}main{max-width:1500px;margin:0 auto;padding:24px}h1,h2{font-family:Cinzel,Georgia,serif;font-weight:600;color:#e8b33a}h2{border-bottom:1px solid #3a3841;padding-bottom:4px;margin-top:36px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}figure{margin:0;background:#151419;border:1px solid #3a3841;padding:8px}figure img{width:100%;display:block}figcaption{font-size:14px;color:#a7a4ae}</style></head><body><main><h1>Rediseño de la pantalla de venta (resultado real)</h1><h2>Valerius: tres columnas, filtro «Vendibles», marcado en mochila y almacén</h2><p></p><div class=g><figure><img src="valerius-escritorio.png"><figcaption>Escritorio</figcaption></figure><figure><img src="valerius-tableta.png"><figcaption>Tableta</figcaption></figure><figure><img src="valerius-movil.png"><figcaption>Móvil</figcaption></figure></div><h2>Al vender: «+N oro»</h2><p></p><div class=g><figure><img src="vendido-escritorio.png"><figcaption>Escritorio</figcaption></figure><figure><img src="vendido-tableta.png"><figcaption>Tableta</figcaption></figure><figure><img src="vendido-movil.png"><figcaption>Móvil</figcaption></figure></div><h2>Vesper: vender 2 de 6 pociones</h2><p></p><div class=g><figure><img src="cantidad-escritorio.png"><figcaption>Escritorio</figcaption></figure><figure><img src="cantidad-tableta.png"><figcaption>Tableta</figcaption></figure><figure><img src="cantidad-movil.png"><figcaption>Móvil</figcaption></figure></div><h2>Ventanita: no lo compra y a quién se vende</h2><p></p><div class=g><figure><img src="ficha-escritorio.png"><figcaption>Escritorio</figcaption></figure><figure><img src="ficha-tableta.png"><figcaption>Tableta</figcaption></figure></div></main></body></html>
